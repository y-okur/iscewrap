[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iscewrap"
version = "0.1.0"
description = "Lightweight Python wrappers for ISCE/ISCE2 workflows."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Yağızalp Okur"}
]
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
iscewrap-alos2 = "iscewrap.cli.alos2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
